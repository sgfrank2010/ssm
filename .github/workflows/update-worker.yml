name: 同步上游 Worker 代码 (修正路徑版)

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 检查版本并下载更新
        id: process_update
        run: |
          # 1. 獲取最新 Release 資訊
          API_URL="https://github.com"
          RELEASE_DATA=$(curl -s $API_URL)
          LATEST_TAG=$(echo "$RELEASE_DATA" | jq -r '.tag_name')
          
          if [ "$LATEST_TAG" = "null" ]; then
            echo "::error::無法讀取上游 Release，請確認倉庫地址是否正確。"
            exit 1
          fi

          # 2. 檢查本地版本
          CURRENT_VERSION=$(cat version.txt 2>/dev/null || echo "")
          echo "最新版本: $LATEST_TAG, 本地版本: $CURRENT_VERSION"

          if [ "$CURRENT_VERSION" = "$LATEST_TAG" ]; then
            echo "版本已是最新，跳過更新。"
            echo "need_update=false" >> $GITHUB_ENV
          else
            # 3. 動態尋找 ZIP 附件 (自動適應不同的檔案名稱)
            DL_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n 1)
            
            if [ -z "$DL_URL" ] || [ "$DL_URL" = "null" ]; then
               echo "::error::在上游 Release 中找不到任何 ZIP 檔案！"
               exit 1
            fi

            echo "偵測到新版本，準備下載: $DL_URL"
            
            # 4. 執行下載與解壓
            curl -L -f -o update.zip "$DL_URL"
            unzip -o update.zip
            
            # 5. 清理並紀錄版本
            rm update.zip
            echo "$LATEST_TAG" > version.txt
            echo "need_update=true" >> $GITHUB_ENV
            echo "latest_tag=$LATEST_TAG" >> $GITHUB_ENV
          fi

      - name: 提交更新到 GitHub
        if: env.need_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Auto Sync: Update to ${{ env.latest_tag }}"
          # 確保包含解壓後產生的所有新檔案
          file_pattern: 'version.txt *.js' 
